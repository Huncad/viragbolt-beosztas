<style>:root{--bg:#f3f6f2;--card:#fff;--ink:#1d2a22;--muted:#5d6b62;--line:#d9e1da;--accent:#b0306a;--bad:#b3261e}

input,button{font:inherit;font-size:16px;min-height:46px;border-radius:9px;border:1px solid var(--line);padding:8px 12px;background:var(--card);color:var(--ink)}
button{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}[hidden]{display:none!important}#err{color:var(--bad);font-size:.9rem;min-height:1.2em}</style></head>
