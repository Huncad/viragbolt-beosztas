<style>:root{--bg:#f3f6f2;--card:#fff;--ink:#1d2a22;--muted:#5d6b62;--line:#d9e1da;--accent:#b0306a;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#121815;--card:#1a221d;--ink:#e6ede8;--muted:#9aa89f;--line:#2c3831;--accent:#e77aa9;--bad:#f28b82;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:360px;display:grid;gap:12px}
h1{font:400 1.6rem Georgia,serif;margin:0}p{margin:0;color:var(--muted);font-size:.9rem}
input,button{font:inherit;font-size:16px;min-height:46px;border-radius:9px;border:1px solid var(--line);padding:8px 12px;background:var(--card);color:var(--ink)}
button{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}[hidden]{display:none!important}#err{color:var(--bad);font-size:.9rem;min-height:1.2em}</style></head>
