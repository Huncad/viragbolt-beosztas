<style>:root{--bg:#f3f6f2;--card:#fff;--ink:#1d2a22;--muted:#5d6b62;--line:#d9e1da;--accent:#b0306a;--bad:#b3261e}

 return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c)))}
async function show(raw){
 if(opened)return;const t=await decrypt(raw);if(opened)return;opened=true;
 await ready();const vk=btoa(String.fromCharCode(...new Uint8Array(raw)));
 document.open();document.write(t.replace("<body>","<body><script>window.__VK="+JSON.stringify(vk)+"<\/script>"));document.close()}
(async()=>{let s=null;try{s=localStorage.getItem(KEY)}catch(_){}
 if(s){try{await show(u(s));return}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}}
 F.hidden=false;document.getElementById("pw").focus()})();
F.addEventListener("submit",async e=>{e.preventDefault();if(opened)return;const b=document.getElementById("go"),er=document.getElementById("err");b.disabled=true;b.textContent="Ellenőrzés…";er.textContent="";
 try{const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("pw").value),"PBKDF2",false,["deriveBits"]);
  const raw=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,256));
  await decrypt(raw);try{localStorage.setItem(KEY,btoa(String.fromCharCode(...raw)))}catch(_){}
  await show(raw)}
 catch(_){er.textContent="Hibás jelszó.";b.disabled=false;b.textContent="Belépés"}});
</script></body></html>
