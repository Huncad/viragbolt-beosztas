<style>:root{--bg:#f3f6f2;--card:#fff;--ink:#1d2a22;--muted:#5d6b62;--line:#d9e1da;--accent:#b0306a;--bad:#b3261e}

const F=document.getElementById("f");let opened=false;
const ready=()=>document.readyState==="complete"?Promise.resolve():new Promise(r=>addEventListener("load",r,{once:true}));
async function decrypt(raw){const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c)))}
async function show(raw){
 if(opened)return;const t=await decrypt(raw);if(opened)return;opened=true;
